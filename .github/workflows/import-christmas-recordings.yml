name: Import classic instrumental recordings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-christmas-recordings.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download credited recordings from the artist
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.request, urllib.parse
          folder=pathlib.Path('gameplay/music'); folder.mkdir(exist_ok=True)
          tracks=[
            ('bells-bright.mp3','Jingle Bells','Jingle Bells 3.mp3','Piano, glockenspiel and celesta arrangement'),
            ('bells-ensemble.mp3','Jingle Bells','Jingle Bells.mp3','Piano and wind ensemble arrangement')
          ]
          entries=[]
          for filename,title,original,description in tracks:
            url='https://incompetech.com/music/royalty-free/mp3-royaltyfree/'+urllib.parse.quote(original)
            for attempt in range(3):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(req,timeout=60) as response: data=response.read(15000001)
                if not 100000 < len(data) < 15000000: raise ValueError('Unexpected audio file size')
                if not (data[:3]==b'ID3' or data[0]==255 and data[1]&224==224): raise ValueError('Not MP3 audio')
                (folder/filename).write_bytes(data)
                entries.append({'file':filename,'title':title,'description':description,'artist':'Kevin MacLeod','license':'CC BY 4.0','licenseUrl':'https://creativecommons.org/licenses/by/4.0/','source':'https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1100187','download':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'modifications':'Unmodified recording; playback gain and looping controlled by the game.'})
                print(filename,len(data),hashlib.sha256(data).hexdigest()); break
              except Exception:
                if attempt==2: raise
                time.sleep(2*(attempt+1))
          (folder/'manifest.json').write_text(json.dumps(entries,ensure_ascii=False,indent=2)+'\n')
          credits='# Instrumental recording credits\n\n'
          for t in entries:
            credits+=f'## {t["title"]} — {t["description"]}\n\nRecording / arrangement: Kevin MacLeod (incompetech.com).\nLicensed under Creative Commons Attribution 4.0 International.\n\nSource: {t["source"]}\nLicense: {t["licenseUrl"]}\nOriginal recording: {t["download"]}\nFile: `{t["file"]}`\nSHA-256: `{t["sha256"]}`\n\n{t["modifications"]}\n\n'
          credits+='The credits and license apply to these recordings, not merely the underlying melody. Retain attribution when reusing these files.\n'
          (folder/'CREDITS.md').write_text(credits)
          PY
      - name: Commit only imported audio and its provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gameplay/music/bells-bright.mp3 gameplay/music/bells-ensemble.mp3 gameplay/music/manifest.json gameplay/music/CREDITS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add attributed Jingle Bells instrumental recordings'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Package source and audio for verification
        if: always()
        run: tar --exclude=.git -czf /tmp/harbour-classic-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbour-classic-source
          path: /tmp/harbour-classic-source.tar.gz
          retention-days: 3
